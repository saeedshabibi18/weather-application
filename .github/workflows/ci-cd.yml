name: CI/CD — Weather App Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  IMAGE_NAME: weather-cicd-app
  CONTAINER_PORT: 5000
  HOST_PORT: 80

jobs:
  # ─── STAGE 1: BUILD & TEST ──────────────────────────────────────────────────
  build-and-test:
    name: 🔨 Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: ✅ Run health check test
        run: |
          python -c "
          import app as application
          client = application.app.test_client()
          resp = client.get('/health')
          assert resp.status_code == 200, f'Health check failed: {resp.status_code}'
          import json
          data = json.loads(resp.data)
          assert data['status'] == 'ok', f'Unexpected status: {data}'
          print('✅ Health check passed:', data)
          "

      - name: ✅ Run route test
        run: |
          python -c "
          import app as application
          client = application.app.test_client()
          resp = client.get('/')
          assert resp.status_code == 200, f'Index route failed: {resp.status_code}'
          print('✅ Index route passed')
          "

  # ─── STAGE 2: DOCKER BUILD & PUSH ──────────────────────────────────────────
  docker-build-push:
    name: 🐳 Docker Build & Push
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🔑 Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🏷️ Generate image tag
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          IMAGE_TAG="${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${SHORT_SHA}"
          LATEST_TAG="${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest"
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "latest_tag=${LATEST_TAG}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🐳 Build & Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image_tag }}
            ${{ steps.meta.outputs.latest_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 📋 Print image info
        run: |
          echo "✅ Image pushed: ${{ steps.meta.outputs.image_tag }}"
          echo "✅ Image pushed: ${{ steps.meta.outputs.latest_tag }}"

  # ─── STAGE 3: DEPLOY TO AWS EC2 ────────────────────────────────────────────
  deploy-to-ec2:
    name: 🚀 Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: 🚀 SSH & Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "📦 Pulling latest Docker image..."
            docker pull ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest

            echo "🛑 Stopping old container (if running)..."
            docker stop ${{ env.IMAGE_NAME }} 2>/dev/null || true
            docker rm   ${{ env.IMAGE_NAME }} 2>/dev/null || true

            echo "🚀 Starting new container..."
            docker run -d \
              --name ${{ env.IMAGE_NAME }} \
              --restart unless-stopped \
              -p ${{ env.HOST_PORT }}:${{ env.CONTAINER_PORT }} \
              -e WEATHER_API_KEY=${{ secrets.WEATHER_API_KEY }} \
              ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest

            echo "⏳ Waiting for health check..."
            sleep 8
            curl -sf http://localhost:${{ env.HOST_PORT }}/health && \
              echo "✅ Deployment successful!" || \
              (echo "❌ Health check failed!" && docker logs ${{ env.IMAGE_NAME }} && exit 1)

            echo "🧹 Cleaning up old images..."
            docker image prune -f